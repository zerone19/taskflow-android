name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Override Gradle version to 8.11.1 (JDK 17 compatible)
        run: |
          sed -i 's|gradle-8.14.5-bin.zip|gradle-8.11.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TaskFlow-${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/TaskFlow-${{ github.ref_name }}.aab

      - name: Upload APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TaskFlow-${{ github.ref_name }}.apk
            dist/TaskFlow-${{ github.ref_name }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
