name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > keystore.properties

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TaskFlow-${{ github.ref_name }}.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/TaskFlow-${{ github.ref_name }}.aab

      - name: Upload APK & AAB to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TaskFlow-${{ github.ref_name }}.apk
            dist/TaskFlow-${{ github.ref_name }}.aab
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
